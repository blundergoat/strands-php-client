# .gruff-php.yaml
# Generated by `gruff-php init`. Mirrors gruff-php registry defaults; edit to customise.
# Add project-specific generated paths under paths.ignore, such as var/cache/** or generated/**.
# After reviewing current findings, `gruff-php analyse --generate-baseline` records them as known debt.
# Future analyse/report runs auto-apply gruff-baseline.json; use `gruff-php analyse --no-baseline` to audit without it.
minimumPhpVersion: 8.3
paths:
    ignore:
        - '.agents/**'
        - '.antigravitycli/**'
        - '.claude/**'
        - '.codex/**'
        - '.github/**'
        - '.goat-flow/**'
        - history.json
        - infection-report.json
        - 'scripts/**'
        - 'src/Vendor/**'
        - 'tests/Fixtures/**'
allowlists:
    acceptedAbbreviations: []
    secretPreviews: []
selection:
    tiers: []
    pillars: []
    rules: []
    excludePillars: []
    excludeRules: []
rules:
    complexity.cognitive:
        enabled: true
        threshold: 30
        severity: error
    complexity.cyclomatic:
        enabled: true
        threshold: 20
        severity: error
    complexity.halstead-volume:
        enabled: true
        threshold: 8000
        severity: error
    complexity.maintainability-index:
        enabled: true
        threshold: 35
        severity: error
    complexity.nesting-depth:
        enabled: true
        threshold: 6
        severity: error
    complexity.npath:
        enabled: true
        threshold: 200
        severity: error
    dead-code.unused-private-method:
        enabled: true
    dead-code.unused-private-property:
        enabled: true
    design.single-implementor-interface:
        enabled: true
        options:
            externalNamespacePrefixes:
                - Psr\
                - Symfony\
                - Doctrine\
                - Twig\
                - League\
                - PhpParser\
                - PHPUnit\
                - Stringable
                - Throwable
                - Countable
                - IteratorAggregate
                - Iterator
                - JsonSerializable
                - ArrayAccess
                - Traversable
            frameworkAttributePrefixes:
                - Symfony\
                - Doctrine\
                - Attribute\AsCommand
                - Attribute\AsController
                - Attribute\AutoconfigureTag
                - Attribute\AsEventSubscriber
            treatMockUsageAsImplementor: false
            additionalExcludedPaths: []
    docs.bare-phpdoc-tags:
        enabled: true
    docs.missing-class-phpdoc:
        enabled: true
    docs.missing-constant-phpdoc:
        enabled: true
    docs.missing-file-phpdoc:
        enabled: true
    docs.missing-param-tag:
        enabled: true
    docs.missing-property-phpdoc:
        enabled: true
    docs.missing-public-phpdoc:
        enabled: true
    docs.missing-readme:
        enabled: true
    docs.missing-return-tag:
        enabled: true
    docs.missing-throws-tag:
        enabled: true
    docs.regex-comment:
        enabled: true
        options:
            functionNames:
                - preg_match
    docs.stale-param-tag:
        enabled: true
    docs.todo-density:
        enabled: true
        threshold: 10
        severity: error
    docs.var-annotation-description:
        enabled: true
    modernisation.constructor-promotion-candidate:
        enabled: true
    modernisation.enum-candidate:
        enabled: true
    modernisation.first-class-callable-candidate:
        enabled: true
    modernisation.forbidden-global-access:
        enabled: true
    modernisation.match-expression-candidate:
        enabled: true
    modernisation.mixed-type-overuse:
        enabled: true
    modernisation.named-argument-opportunity:
        enabled: true
        thresholds:
            minPositionalArguments: 5
    modernisation.phpdoc-mixed-overuse:
        enabled: true
    modernisation.public-property:
        enabled: true
    modernisation.readonly-property-candidate:
        enabled: true
    naming.abbreviation-allowlist:
        enabled: true
        options:
            ignoredNames:
                - this
            minLength: 2
            maxLength: 3
    naming.boolean-prefix:
        enabled: true
        options:
            allowedPrefixes:
                - is
                - has
                - can
                - should
                - will
                - was
                - does
                - allows
                - all
                - contains
                - extends
                - invokes
                - matches
                - refers
                - returns
                - looks
                - supports
                - touches
                - uses
            stateAdjectiveAllowlist:
                - active
                - enabled
                - disabled
                - applicable
                - generated
                - interactive
                - emitted
                - visible
                - available
                - valid
                - strict
                - silent
    naming.class-file-mismatch:
        enabled: true
    naming.confusing-name:
        enabled: true
    naming.generic-method:
        enabled: true
    naming.hungarian-notation:
        enabled: true
        options:
            typePrefixes:
                - str
                - int
                - float
                - bool
                - arr
                - obj
                - fn
                - cls
    naming.identifier-quality:
        enabled: true
        options:
            placeholderNames:
                - foo
                - bar
                - baz
                - tmp
                - temp
                - obj
                - arr
            genericTokens:
                - data
                - entry
                - info
                - input
                - item
                - row
                - thing
                - stuff
                - helper
                - util
                - value
            ignoredNames:
                - _
                - e
                - exception
                - throwable
                - i
                - j
                - k
                - idx
                - index
                - input
                - key
            minScopeReferences: 1
            loopBodyThreshold: 4
    naming.negative-boolean:
        enabled: true
        options:
            cliMirrorAllowlist: []
    naming.parameter-type-name:
        enabled: true
        options:
            typeSuffixesToTrim:
                - Interface
            ignoredParameterNames: []
    naming.short-variable:
        enabled: true
    naming.suffix-hungarian:
        enabled: true
        options:
            typeSuffixes:
                - String
                - Array
                - List
                - Map
                - Set
                - Hash
                - Object
                - Integer
                - Float
                - Boolean
    naming.test-naming-consistency:
        enabled: true
    security.dangerous-function-call:
        enabled: true
    security.disabled-ssl-verification:
        enabled: true
    security.error-suppression:
        enabled: true
    security.extract-compact-user-input:
        enabled: true
    security.github-actions-risky-workflow:
        enabled: true
    security.header-injection:
        enabled: true
    security.insecure-random:
        enabled: true
    security.path-traversal-file-access:
        enabled: true
    security.process-command-construction:
        enabled: true
    security.request-controlled-url:
        enabled: true
    security.sensitive-data-logging:
        enabled: true
    security.silent-catch:
        enabled: true
    security.sql-concatenation:
        enabled: true
    security.unsafe-archive-extraction:
        enabled: true
    security.unsafe-unserialize:
        enabled: true
    security.unsafe-xml-loading:
        enabled: true
    security.variable-include:
        enabled: true
    security.weak-crypto:
        enabled: true
    sensitive-data.api-key-pattern:
        enabled: true
    sensitive-data.aws-access-key:
        enabled: true
    sensitive-data.database-url-password:
        enabled: true
    sensitive-data.hardcoded-env-value:
        enabled: true
    sensitive-data.high-entropy-string:
        enabled: true
        thresholds:
            minLength: 32
            entropy: 4.2
    sensitive-data.jwt-token:
        enabled: true
    sensitive-data.phi-pattern:
        enabled: true
    sensitive-data.pii-test-fixture:
        enabled: true
    sensitive-data.private-key:
        enabled: true
    size.average-method-length:
        enabled: true
        threshold: 50
        severity: error
    size.class-length:
        enabled: true
        threshold: 1500
        severity: error
    size.file-length:
        enabled: true
        threshold: 1500
        severity: error
    size.method-length:
        enabled: true
        threshold: 100
        severity: error
    size.parameter-count:
        enabled: true
        threshold: 20
        severity: error
        options:
            promotedConstructorMaxParameters: 25
            constructorMaxParameters: 20
    size.property-count:
        enabled: true
        threshold: 25
        severity: error
    size.public-method-count:
        enabled: true
        threshold: 60
        severity: error
    test-quality.conditional-logic:
        enabled: true
        options:
            ignoredPathPatterns: []
    test-quality.data-provider-annotation:
        enabled: true
    test-quality.eager-test:
        enabled: true
        thresholds:
            minAssertions: 3
    test-quality.empty-data-provider:
        enabled: true
    test-quality.exception-type-only:
        enabled: true
    test-quality.excessive-mocking:
        enabled: true
        thresholds:
            maxMocks: 3
    test-quality.extends-production-class:
        enabled: true
    test-quality.global-state-mutation:
        enabled: true
    test-quality.loop-assertion-without-message:
        enabled: true
    test-quality.magic-number-assertion:
        enabled: true
        options:
            allowedLiterals:
                - 200
                - 201
                - 202
                - 204
                - 301
                - 302
                - 303
                - 304
                - 307
                - 308
                - 400
                - 401
                - 403
                - 404
                - 405
                - 409
                - 410
                - 422
                - 429
                - 500
                - 502
                - 503
                - 504
    test-quality.mock-only-test:
        enabled: true
    test-quality.mock-without-expectation:
        enabled: true
    test-quality.mocking-domain-object:
        enabled: true
        options:
            domainNamespaces: []
    test-quality.multiple-aaa-cycles:
        enabled: true
        thresholds:
            minCycles: 3
        options:
            ignoredPathPatterns: []
    test-quality.mystery-guest:
        enabled: true
    test-quality.naming-consistency:
        enabled: true
        options:
            poorNamePatterns:
                - '/^test[A-Z][A-Za-z]*(?:Works|Basic|Simple|Test)$/'
                - '/^test[A-Z][A-Za-z]*\d+$/'
    test-quality.no-assertions:
        enabled: true
    test-quality.phpunit-coverage-source-missing:
        enabled: true
    test-quality.phpunit-deprecations-not-fatal:
        enabled: true
    test-quality.phpunit-strict-flags-missing:
        enabled: true
    test-quality.private-reflection:
        enabled: true
    test-quality.repeated-structure-missing-data-provider:
        enabled: true
        options:
            ignoredPathPatterns: []
    test-quality.setup-bloat:
        enabled: true
        thresholds:
            minSetupLines: 8
    test-quality.skipped-without-reason:
        enabled: true
    test-quality.sleep-in-test:
        enabled: true
    test-quality.sut-not-called:
        enabled: true
    test-quality.tautological-type-assertion:
        enabled: true
    test-quality.test-longer-than-sut:
        enabled: true
        thresholds:
            minTestLines: 12
    test-quality.test-method-too-long:
        enabled: true
        thresholds:
            maxMeaningfulLines: 25
        options:
            pathOverrides: []
    test-quality.testdox-readability:
        enabled: true
        thresholds:
            minWords: 2
    test-quality.trivial-assertion:
        enabled: true
    test-quality.trivial-snapshot:
        enabled: true
        thresholds:
            maxLiteralLength: 5
    test-quality.unused-mock:
        enabled: true
    waste.commented-out-code:
        enabled: true
    waste.empty-class:
        enabled: true
    waste.empty-method:
        enabled: true
    waste.one-line-method:
        enabled: true
        options:
            minParameters: 1
            minInFileCallers: 0
            namedAlternativeFactoryExempt: false
            allowedSymbols: []
    waste.redundant-variable:
        enabled: true
    waste.unreachable-code:
        enabled: true
    waste.unused-import:
        enabled: true
    waste.unused-parameter:
        enabled: true
