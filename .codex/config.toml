# Codex CLI config template - copy to .codex/config.toml
#
# Key differences from Claude Code:
# - No PreToolUse equivalent for non-shell tools (file writes can't be pre-blocked)
# - This file enables the hooks engine and the goat-flow permission profile
# - Hook registrations live in .codex/hooks.json
# - The shipped codex-hooks.json template registers the PreToolUse deny hook
# - goat-flow does not model a Codex post-turn hook event
default_permissions = "goat-flow"

[features]
hooks = true

[permissions.goat-flow.filesystem]
glob_scan_max_depth = 3
# Codex 0.131 accepts exact paths and trailing "/**" subtrees here.
# Exact entries must point at files that exist in the target checkout; absent
# exact paths can make Codex fail before shell startup. Filename globs such as
# "*.key" are covered by .codex/hooks/deny-dangerous.sh.
":workspace_roots" = { "." = "write", "secrets/**" = "none", ".ssh/**" = "none", ".aws/**" = "none", ".docker/**" = "none", ".gnupg/**" = "none", ".kube/**" = "none" }
